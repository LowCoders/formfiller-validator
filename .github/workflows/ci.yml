# ============================================
# FormFiller Validator - Continuous Integration
# ============================================
# Runs on every push and pull request
# Tests and builds the validation library
# ============================================

name: CI

on:
  push:
    branches: [ main, master, develop, 'feature/**' ]
  pull_request:
    branches: [ main, master, develop ]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Lint and Type Check
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The lockfile pins formfiller-schema to git+ssh://git@github.com/..., which the
      # runner has no key for, so the ssh forms are rewritten to a token URL before npm ci.
      - name: Configure git for the private schema package
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
        run: |
          for from in "git+ssh://git@github.com/" "ssh://git@github.com/" "git@github.com:" "https://github.com/"; do
            git config --global --add url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "$from"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  # ============================================
  # Build
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The lockfile pins formfiller-schema to git+ssh://git@github.com/..., which the
      # runner has no key for, so the ssh forms are rewritten to a token URL before npm ci.
      - name: Configure git for the private schema package
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
        run: |
          for from in "git+ssh://git@github.com/" "ssh://git@github.com/" "git@github.com:" "https://github.com/"; do
            git config --global --add url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "$from"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # dist/ is committed and consumed directly by the backend and the frontend through a
      # GitHub reference, so a stale dist ships broken code without any other signal.
      - name: Verify committed dist is up to date
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ differs from a fresh build. Run 'npm run build' and commit dist/."
            exit 1
          fi

  # ============================================
  # Test
  # ============================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The lockfile pins formfiller-schema to git+ssh://git@github.com/..., which the
      # runner has no key for, so the ssh forms are rewritten to a token URL before npm ci.
      - name: Configure git for the private schema package
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
        run: |
          for from in "git+ssh://git@github.com/" "ssh://git@github.com/" "git@github.com:" "https://github.com/"; do
            git config --global --add url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "$from"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

